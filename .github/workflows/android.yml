name: Android Debug APK

on:
  push:
    branches: [ main, v2.0-integration ]
  pull_request:
    branches: [ main, v2.0-integration ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK ABI and report package size
        shell: bash
        run: |
          python3 - <<'PY'
          import os, zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          if not os.path.isfile(apk):
              raise SystemExit("APK output missing")
          with zipfile.ZipFile(apk) as archive:
              abis = sorted({
                  name.split("/")[1]
                  for name in archive.namelist()
                  if name.startswith("lib/") and name.count("/") >= 2
              })
          print(f"APK size: {os.path.getsize(apk) / 1024 / 1024:.1f} MiB")
          print(f"Native ABIs: {', '.join(abis) if abis else 'none'}")
          unexpected = set(abis) - {"arm64-v8a"}
          if unexpected:
              raise SystemExit(f"Unexpected native ABIs found: {sorted(unexpected)}")
          PY
      - name: Verify BVD Data Binding survives APK packaging
        shell: bash
        run: |
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import zipfile

          aar_files = list(Path("bvd-downloader/build/outputs/aar").glob("*debug.aar"))
          if not aar_files:
              raise SystemExit("BVD debug AAR missing")
          aar = aar_files[0]
          with zipfile.ZipFile(aar) as library:
              if "classes.jar" not in library.namelist():
                  raise SystemExit("BVD AAR has no classes.jar")
              with zipfile.ZipFile(BytesIO(library.read("classes.jar"))) as classes:
                  class_names = set(classes.namelist())
              required = {
                  "cc/kafuu/bilidownload/BR.class",
                  "cc/kafuu/bilidownload/databinding/ActivityVideoDetailsBinding.class",
              }
              missing = sorted(required - class_names)
              if missing:
                  raise SystemExit("BVD AAR is missing generated Data Binding classes: " + ", ".join(missing))
              print("BVD AAR Data Binding classes verified")

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          marker = b"Lcc/kafuu/bilidownload/BR;"
          with zipfile.ZipFile(apk) as package:
              dex_files = sorted(
                  name for name in package.namelist()
                  if name.startswith("classes") and name.endswith(".dex")
              )
              if not dex_files:
                  raise SystemExit("APK contains no DEX files")
              present = [name for name in dex_files if marker in package.read(name)]
              if not present:
                  raise SystemExit("APK DEX is missing cc.kafuu.bilidownload.BR; refusing to publish a crashing APK")
              print("BVD BR class reference packaged in: " + ", ".join(present))
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliVdl-v2.0.19-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
